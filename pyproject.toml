[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "terrarium"
version = "0.1.0"
description = "A Python terrarium simulation project."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "terrarium contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["click>=8.1"]

[project.scripts]
terrarium = "terrarium.cli:main"

[project.urls]
Homepage = "https://github.com/teerev/terrarium"
Repository = "https://github.com/teerev/terrarium"

[tool.hatch.build.targets.wheel]
packages = ["src/terrarium"]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
  "types-click",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["terrarium"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Keep mypy focused on the library code.
files = ["src"]

[[tool.mypy.overrides]]
module = ["click"]
ignore_missing_imports = true
