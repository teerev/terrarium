[project]
name = "terrarium"
version = "0.1.0"
description = "Terrarium simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "teerev" }]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
terrarium = "terrarium.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --cov=terrarium --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["terrarium"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
