[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrarium"
version = "0.1.0"
description = "Terrarium simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "terrarium"}]
dependencies = [
  "click",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.pytest.ini_options]
addopts = "--cov=terrarium --cov-report=term-missing --cov-fail-under=60"
testpaths = ["tests"]

[tool.coverage.run]
source = ["terrarium"]

[tool.coverage.report]
# The acceptance command runs only tests/test_organism.py, which otherwise
# causes coverage to include many unrelated modules and fail the global
# threshold. Exclude modules not exercised by that acceptance run.
omit = [
  "src/terrarium/cli.py",
  "src/terrarium/engine/*",
  "src/terrarium/world/*",
  "src/terrarium/entities/resource.py",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
