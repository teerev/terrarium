[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "terrarium"
version = "0.1.0"
description = "A terrarium simulation project."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "terrarium contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/teerev/terrarium"

[tool.hatch.build.targets.wheel]
packages = ["src/terrarium"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = false

[dependency-groups]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
  "mypy>=1.0"
]
