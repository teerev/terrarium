[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "terrarium"
version = "0.1.0"
description = "Emergent life simulation sandbox (project skeleton)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Terrarium Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "click>=8.1"
]

[project.scripts]
terrarium = "terrarium.cli:main"

[project.urls]
Homepage = "https://github.com/teerev/terrarium"

[tool.hatch.build.targets.wheel]
packages = ["src/terrarium"]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1.0",
  "mypy>=1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=terrarium --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["terrarium"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

# Keep strict mode, but avoid forcing explicit exports for now.
# This commonly fails early on and can be enabled later once APIs stabilize.
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["click"]
ignore_missing_imports = true
